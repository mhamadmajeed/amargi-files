name: Deploy transcoder

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - wrangler.jsonc
      - transcoder/**
      - server.js
      - package.json
      - package-lock.json
      - .github/workflows/deploy-transcoder.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deploy tools
        run: npm install --no-save wrangler @cloudflare/containers

      - name: Deploy worker + container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.R2_ACCOUNT_ID }}" | npx wrangler secret put R2_ACCOUNT_ID
          echo "${{ secrets.R2_BUCKET }}" | npx wrangler secret put R2_BUCKET
          echo "${{ secrets.R2_ACCESS_KEY_ID }}" | npx wrangler secret put R2_ACCESS_KEY_ID
          echo "${{ secrets.R2_SECRET_ACCESS_KEY }}" | npx wrangler secret put R2_SECRET_ACCESS_KEY
          echo "${{ secrets.R2_ENDPOINT }}" | npx wrangler secret put R2_ENDPOINT
          echo "${{ secrets.TRANSCODER_TRIGGER_SECRET }}" | npx wrangler secret put TRIGGER_SECRET
